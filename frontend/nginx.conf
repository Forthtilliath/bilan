# En-tetes de securite communs (repetes dans chaque location qui ajoute ses propres en-tetes :
# nginx n'herite pas des add_header du niveau server des qu'une location en declare).
map $uri $security_csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API Spring Boot (service docker-compose "backend")
  location /api/ {
    proxy_pass http://backend:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;
  }

  # Les sondes de l'actuator ne sont pas publiques.
  location /actuator/ {
    return 404;
  }

  # Fichiers fingerprintes par le build Angular : cache long
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Routes du SPA (/comptes/..., /investissements/...) : toujours index.html
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $security_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
