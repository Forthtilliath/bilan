spring.application.name=bilan

server.port=${PORT:8082}

# PostgreSQL via docker-compose (voir docker-compose.yml a la racine du depot).
# En dev : `docker compose up -d db` puis demarrer le backend. Identifiants de dev uniquement.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/bilan}
spring.datasource.username=${DB_USER:bilan}
spring.datasource.password=${DB_PASSWORD:bilan}

# Schema gere par Flyway (src/main/resources/db/migration) ; Hibernate verifie seulement.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

management.endpoints.web.exposure.include=health

# Donnees de demonstration : generees au premier demarrage (base vide), puis regenerees
# si la derniere operation date de plus de `stale-after-days` jours (demo toujours a jour).
app.demo.enabled=${DEMO_ENABLED:true}
app.demo.stale-after-days=10
app.zone=Europe/Paris
